upstream django_app {
    server 127.0.0.1:5000;  
}

server {
    listen 80;
    server_name _;  
    
    access_log /var/log/nginx/fefu_lab_access.log;
    error_log /var/log/nginx/fefu_lab_error.log;

    
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
    location /static/ {
        alias /var/www/fefu_lab/web_fefu_2025/web_2025/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    
    location /media/ {
        alias /var/www/fefu_lab/web_fefu_2025/web_2025/media/;
    }

    
    client_max_body_size 10M;
}