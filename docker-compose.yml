version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}  # Из .env
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./django
    command: gunicorn web_2025.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DJANGO_SETTINGS_MODULE: web_2025.settings
      PYTHONPATH: /app/web_2025:${PYTHONPATH}
    volumes:
      - ./django:/app  # Для dev: hot-reload кода
      - static_volume:/app/staticfiles  # Собранная статика
      - media_volume:/app/media
    expose:
      - 8000

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media

volumes:
  postgres_data:
  static_volume:
  media_volume:
